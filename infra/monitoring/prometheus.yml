# Native Prometheus: prometheus --config.file=infra/monitoring/prometheus.yml
# Write METRICS_TOKEN to the credentials file below (readable only by Prometheus).
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: untukmu-api
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/untukmu-token
    static_configs:
      - targets: ["127.0.0.1:8000"]
