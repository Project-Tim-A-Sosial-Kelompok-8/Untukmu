name: Untukmu 
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1' # Senin 08.00 WIB
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: apps/api/requirements-dev.lock }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prepare:engine --workspace apps/web
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: pip install -r apps/api/requirements-dev.lock
      - run: ruff check app tests alembic && pytest -q
        working-directory: apps/api
      - run: alembic upgrade head --sql > migration.sql
        working-directory: apps/api
        env:
          JWT_SECRET: ci-only-random-test-key-not-a-deployment-secret-123
      - run: python scripts/verify_original.py --archive-only --if-present
      - run: python scripts/init_env.py
      - run: docker compose up -d --build --wait
      - run: node scripts/test-browser-local.mjs
        env:
          UNTUKMU_BROWSER_REPORT: ../../docs/pengujian/hasil/button-audit-results.json
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            compose.log
            apps/api/migration.sql
            apps/web/playwright-report
            apps/web/test-results
            docs/pengujian/hasil/button-audit-results.json
      - if: always()
        run: docker compose down
