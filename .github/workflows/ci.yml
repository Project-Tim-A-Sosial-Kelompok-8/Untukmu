name: Untukmu
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1" # Senin 08.00 WIB
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: backend
      - run: go build -o untukmu ./cmd/untukmu
        working-directory: backend
      - run: node scripts/test-browser-local.mjs
        env:
          UNTUKMU_BROWSER_REPORT: test-results/button-audit-results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            frontend/playwright-report
            frontend/test-results
