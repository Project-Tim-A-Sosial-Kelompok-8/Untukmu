name: untukmu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Jalankan python scripts/init_env.py}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build: { context: ., dockerfile: infra/minio/Dockerfile }
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
  init-storage:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: *api_env
    command: ["python", "-m", "scripts.init_storage"]
    depends_on: [minio]
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: *api_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-storage: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: *api_env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
    depends_on:
      api: { condition: service_healthy }
  gateway:
    image: caddy:2-alpine
    ports: ["127.0.0.1:3000:80"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [web]
  monitoring-token:
    image: alpine:3.22
    profiles: [monitoring]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    command: ["sh", "-ec", "test $${#METRICS_TOKEN} -ge 32; umask 022; printf '%s' \"$$METRICS_TOKEN\" > /tokens/token"]
    volumes: ["monitoring_token:/tokens"]
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - monitoring_token:/etc/prometheus/credentials:ro
      - prometheus_data:/prometheus
    depends_on:
      api: { condition: service_healthy }
      monitoring-token: { condition: service_completed_successfully }
  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./infra/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/untukmu.yml:ro
      - ./infra/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/untukmu.yml:ro
      - ./infra/monitoring/grafana/untukmu.json:/var/lib/grafana/dashboards/untukmu.json:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    entrypoint: ["sh", "-ec", "test $${#GF_SECURITY_ADMIN_PASSWORD} -ge 12; exec /run.sh"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  monitoring_token:
  prometheus_data:
  grafana_data:
