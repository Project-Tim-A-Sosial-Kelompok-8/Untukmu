name: untukmu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Jalankan python scripts/init_env.py}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build: { context: ., dockerfile: infra/minio/Dockerfile }
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
  init-storage:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: *api_env
    command: ["python", "-m", "scripts.init_storage"]
    depends_on: [minio]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: *api_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-storage: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: *api_env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
    depends_on:
      api: { condition: service_healthy }
  gateway:
    image: caddy:2-alpine
    ports: ["127.0.0.1:3000:80"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [web]

volumes:
  postgres_data:
  redis_data:
  minio_data:
