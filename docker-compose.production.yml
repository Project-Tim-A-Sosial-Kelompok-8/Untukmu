# Docker Compose >= 2.24.4. Use together with docker-compose.yml.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  minio:
    ports: !reset []
    restart: unless-stopped
  migrate:
    environment:
      ENVIRONMENT: production
  init-storage:
    environment:
      ENVIRONMENT: production
  api:
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
  worker:
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
  web:
    restart: unless-stopped
    build:
      args:
        S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Isi alamat storage HTTPS produksi}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Isi site key Turnstile produksi}
  gateway:
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Isi hostname aplikasi produksi}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?Isi hostname storage produksi}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
  grafana:
    ports: !reset []
    restart: unless-stopped
  prometheus:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
