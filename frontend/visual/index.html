<!doctype html>
<!-- Visual controls adapted from Justin Zhang Jun's engine, PolyForm Noncommercial License 1.0.0. See THIRD-PARTY-NOTICES.md. -->
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Untukmu — Pesan, Kenangan, dan Doa</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;color:#e8e6f0;font-family:system-ui,sans-serif}
    canvas{display:block;touch-action:none}
    #beacon-panel{display:none;position:fixed;top:94px;right:24px;max-height:calc(100dvh - 205px);overflow:auto;width:min(360px,calc(100vw - 48px));padding:18px;background:rgba(13,17,30,.96);border:1px solid rgba(180,190,235,.18);border-radius:16px;z-index:15;box-sizing:border-box}
    #beacon-panel.open{display:block}
    #skyback,#return-home{position:fixed;top:86px;left:20px;z-index:16;min-height:42px;padding:10px 16px;border:1px solid rgba(180,190,235,.22);border-radius:12px;background:#121727;color:#eee;cursor:pointer}
    #skyback,#return-home{display:none}
    .gx-cinema .um-brand,.gx-cinema .um-dock,.gx-cinema #return-home,.gx-cinema #skyback,.gx-cinema #beacon-panel,.gx-cinema .um-skyctl{display:none!important}
    @media(max-width:600px){#beacon-panel{left:14px;right:14px;width:auto;top:140px;max-height:calc(100dvh - 240px)}#skyback,#return-home{left:14px}}
  </style>
</head>
<body data-view-mode="galaxy">
  <button id="skyback" type="button">← Kembali ke kenangan</button>
  <div id="beacon-panel"><button id="bp-close" aria-label="Tutup kenangan" style="position:absolute;right:8px;top:8px;background:transparent;color:inherit;border:0;font-size:24px;min-width:44px;min-height:44px">×</button><div id="bp-body"></div></div>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="scene.js"></script>
  <script src="language.js"></script>
  <script src="prayers.js"></script>
  <script src="runtime.js"></script>
  <script src="map.js"></script>
  <script src="galaxy.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
